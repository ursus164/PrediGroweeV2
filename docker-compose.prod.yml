version: '3'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/nginx/ssl:/etc/nginx/ssl:ro
      - /var/www/certbot:/var/www/certbot:rw
    depends_on:
      - auth
      - quiz
      - stats
      - images
    # Security hardening
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # Port 80/443
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/run:size=10M,mode=0755
      - /var/cache/nginx:size=100M,mode=0755
      - /var/log/nginx:size=50M,mode=0755
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  auth_db:
    image: postgres:13
    environment:
      - POSTGRES_USER=${AUTH_DB_USER}
      - POSTGRES_PASSWORD=${AUTH_DB_PASSWORD}
      - POSTGRES_DB=auth_db
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    expose:
      - "5432"

  quiz_db:
      image: postgres:13
      environment:
        - POSTGRES_USER=${QUIZ_DB_USER}
        - POSTGRES_PASSWORD=${QUIZ_DB_PASSWORD}
        - POSTGRES_DB=quiz_db
      volumes:
        - quiz_db_data:/var/lib/postgresql/data
      expose:
        - "5432"

  stats_db:
      image: postgres:13
      environment:
        - POSTGRES_USER=${STATS_DB_USER}
        - POSTGRES_PASSWORD=${STATS_DB_PASSWORD}
        - POSTGRES_DB=stats_db
      volumes:
        - stats_db_data:/var/lib/postgresql/data
      expose:
        - "5432"
  images_db:
      image: postgres:13
      environment:
          - POSTGRES_USER=${IMAGES_DB_USER}
          - POSTGRES_PASSWORD=${IMAGES_DB_PASSWORD}
          - POSTGRES_DB=images_db
      volumes:
          - images_db_data:/var/lib/postgresql/data
      expose:
          - "5432"

  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    environment:
      - ENV=production
      - SERVICE_NAME=auth
      - DB_HOST=auth_db
      - DB_PORT=5432
      - DB_NAME=auth_db
      - DB_USER=${AUTH_DB_USER}
      - DB_PASSWORD=${AUTH_DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_PASSWORD=${GMAIL_PASSWORD}
    expose:
      - "8080"
    depends_on:
      - auth_db
    # Security hardening
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=100M,mode=1777
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  quiz:
    build:
      context: ./quiz
      dockerfile: Dockerfile
    environment:
      - ENV=production
      - SERVICE_NAME=quiz
      - DB_HOST=quiz_db
      - DB_PORT=5432
      - DB_NAME=quiz_db
      - DB_USER=${QUIZ_DB_USER}
      - DB_PASSWORD=${QUIZ_DB_PASSWORD}
    expose:
      - "8080"
    depends_on:
      - quiz_db
      - auth
    # Security hardening
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=100M,mode=1777
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  stats:
    build:
      context: ./stats
      dockerfile: Dockerfile
    environment:
      - ENV=production
      - SERVICE_NAME=stats
      - DB_HOST=stats_db
      - DB_PORT=5432
      - DB_NAME=stats_db
      - DB_USER=${STATS_DB_USER}
      - DB_PASSWORD=${STATS_DB_PASSWORD}
    expose:
      - "8080"
    depends_on:
      - stats_db
      - auth
    # Security hardening
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=100M,mode=1777
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  images:
    build:
      context: ./images
      dockerfile: Dockerfile
    environment:
      - ENV=production
      - SERVICE_NAME=images
      - DB_HOST=images_db
      - DB_PORT=5432
      - DB_NAME=images_db
      - DB_USER=${IMAGES_DB_USER}
      - DB_PASSWORD=${IMAGES_DB_PASSWORD}
    expose:
      - "8080"
    volumes:
      - ./images_data:/app/images
    depends_on:
      - auth
      - images_db
    # Security hardening
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=100M,mode=1777
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    environment:
      - ENV=production
      - SERVICE_NAME=admin

    expose:
      - "8080"
    depends_on:
      - auth
      - quiz
      - stats
      - images
    # Security hardening
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=100M,mode=1777
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  frontend:
    build:
      context: ../PrediGroweeV2-UI
      dockerfile: Dockerfile.prod
      args:
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        - NEXT_PUBLIC_AUTH_SERVICE_URL=https://predigrowee.agh.edu.pl/api/auth
        - NEXT_PUBLIC_QUIZ_SERVICE_URL=https://predigrowee.agh.edu.pl/api/quiz
        - NEXT_PUBLIC_STATS_SERVICE_URL=https://predigrowee.agh.edu.pl/api/stats
        - NEXT_PUBLIC_IMAGES_SERVICE_URL=https://predigrowee.agh.edu.pl/api/images
        - NEXT_PUBLIC_ADMIN_SERVICE_URL=https://predigrowee.agh.edu.pl/api/admin
        - AUTH_SERVICE_INTERNAL_URL=http://auth:8080/auth
        - NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
        - NEXT_PUBLIC_RECAPTCHA_SECRET_KEY=${NEXT_PUBLIC_RECAPTCHA_SECRET_KEY}
    environment:
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID= ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      - NEXT_PUBLIC_AUTH_SERVICE_URL=https://predigrowee.agh.edu.pl/api/auth
      - NEXT_PUBLIC_QUIZ_SERVICE_URL=https://predigrowee.agh.edu.pl/api/quiz
      - NEXT_PUBLIC_STATS_SERVICE_URL=https://predigrowee.agh.edu.pl/api/stats
      - NEXT_PUBLIC_IMAGES_SERVICE_URL=https://predigrowee.agh.edu.pl/api/images
      - NEXT_PUBLIC_ADMIN_SERVICE_URL=https://predigrowee.agh.edu.pl/api/admin
      - AUTH_SERVICE_INTERNAL_URL=http://auth:8080/auth
      - NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
      - NEXT_PUBLIC_RECAPTCHA_SECRET_KEY=${NEXT_PUBLIC_RECAPTCHA_SECRET_KEY}
    volumes:
      - ./content:/app/content
    expose:
      - "3000"
    # Security hardening
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=200M,mode=1777
      - /app/.next:size=500M,mode=0755,uid=1001,gid=1001
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  auth_db_data:
  quiz_db_data:
  stats_db_data:
  images_db_data:
  images_data:
  content:


