user nginx;

events {
    worker_connections 1024;
}

http {
    # Hide nginx version information
    server_tokens off;

    # Add MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 8080;

    # Security headers
    # CSP for DEVELOPMENT environment (API proxy - port 8080):
    # - style-src 'unsafe-inline' REQUIRED: Emotion CSS-in-JS (MUI) injects <style data-emotion> tags at runtime
    # - script-src 'unsafe-eval' REQUIRED: Next.js React Fast Refresh uses eval() for hot module reloading
    # - script-src https://accounts.google.com: Google Sign-In integration
    # - script-src https://www.google.com https://www.gstatic.com: Google reCAPTCHA
    # - frame-src https://www.google.com: reCAPTCHA iframe
    # - connect-src http://localhost:8080: API proxy for backend microservices
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://accounts.google.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://localhost:8080; frame-src https://www.google.com; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none';" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Cache control for non-static content
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        location / {
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        location /api/auth/ {
            proxy_pass http://auth:8080/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/images/ {
            proxy_pass http://images:8080/images/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/quiz/ {
            proxy_pass http://quiz:8080/quiz/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/stats/ {
            proxy_pass http://stats:8080/stats/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/admin/ {
            proxy_pass http://admin:8080/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 3000;

    # Security headers
    # CSP for DEVELOPMENT environment (Frontend - port 3000):
    # - style-src 'unsafe-inline' REQUIRED: Emotion CSS-in-JS (MUI) injects <style data-emotion> tags at runtime
    # - script-src 'unsafe-eval' REQUIRED: Next.js React Fast Refresh uses eval() for hot module reloading
    # - script-src https://accounts.google.com: Google Sign-In integration
    # - script-src https://www.google.com https://www.gstatic.com: Google reCAPTCHA
    # - frame-src https://www.google.com: reCAPTCHA iframe
    # - connect-src http://localhost:8080: API proxy for backend microservices
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://accounts.google.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://localhost:8080; frame-src https://www.google.com; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none';" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location / {
            proxy_pass http://frontend:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}