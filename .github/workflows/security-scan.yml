name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Skanowanie codziennie o 2:00 (sprawdzanie nowych CVE)
    - cron: "0 2 * * *"

# Permissions dla SARIF upload do GitHub Security tab
permissions:
  contents: read
  security-events: write
  actions: read

# Security Policy:
# - CRITICAL/HIGH CVE → Pipeline FAILS (must fix)
# - MEDIUM/LOW CVE → Warning only (reported to Security tab)
# - Infrastructure issues (Hadolint/Dockle) → Info only (no block)

jobs:
  hadolint:
    name: Hadolint - Dockerfile Best Practices
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, quiz, stats, images, admin]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./${{ matrix.service }}/Dockerfile
          failure-threshold: style
          # Najbardziej strict: failuje na error > warning > info > style

  dockerfile-lint:
    name: Dockle - Dockerfile Security
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, quiz, stats, images, admin]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image for Dockle
        run: |
          docker build -t ${{ matrix.service }}:latest ./${{ matrix.service }}

      - name: Run Dockle
        uses: erzz/dockle-action@v1
        with:
          image: ${{ matrix.service }}:latest
          exit-code: 1
          failure-threshold: INFO
          # Najbardziej strict: failuje na FATAL > WARN > INFO

  trivy-scan:
    name: Trivy CVE Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [auth, quiz, stats, images, admin]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t ${{ matrix.service }}:latest ./${{ matrix.service }}

      - name: Run Trivy vulnerability scanner (SARIF for Security tab)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.service }}:latest
          format: "sarif"
          output: "trivy-results-${{ matrix.service }}.sarif"
          exit-code: 0
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          scanners: "vuln,secret"
          timeout: 15m

      - name: Run Trivy vulnerability scanner (Table for logs)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.service }}:latest
          format: "table"
          exit-code: 1
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          scanners: "vuln,secret"
          timeout: 15m

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        with:
          sarif_file: "trivy-results-${{ matrix.service }}.sarif"

  sbom-generation:
    name: Generate SBOM (Syft)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, quiz, stats, images, admin]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t ${{ matrix.service }}:latest ./${{ matrix.service }}

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ matrix.service }}:latest
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json

  grype-scan:
    name: Vulnerability Scan SBOM (Grype)
    runs-on: ubuntu-latest
    needs: sbom-generation
    strategy:
      fail-fast: false
      matrix:
        service: [auth, quiz, stats, images, admin]
    steps:
      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom-${{ matrix.service }}

      - name: Scan SBOM with Grype (Table for logs)
        continue-on-error: true
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype sbom:sbom-${{ matrix.service }}.spdx.json -o table --fail-on medium

      - name: Scan SBOM with Grype (SARIF for Security tab)
        uses: anchore/scan-action@v3
        id: grype
        with:
          sbom: sbom-${{ matrix.service }}.spdx.json
          fail-build: true
          severity-cutoff: medium
          # Strict: failuje na CRITICAL > HIGH > MEDIUM
          output-format: sarif

      - name: Upload Grype SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        with:
          sarif_file: results.sarif

  dependency-check:
    name: Go Dependencies Security Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, quiz, stats, images, admin]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.23"
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: Run govulncheck
        run: |
          cd ${{ matrix.service }}
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  static-analysis-go:
    name: Go Static Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, quiz, stats, images, admin]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.23"
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: ${{ matrix.service }}
          args: --timeout=5m

      - name: staticcheck
        run: |
          cd ${{ matrix.service }}
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck -checks all ./...

      - name: gosec (Security Scanner)
        run: |
          cd ${{ matrix.service }}
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt=golint -quiet ./...

      - name: go vet
        run: |
          cd ${{ matrix.service }}
          go vet ./...

  docker-compose-security:
    name: Docker Compose Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Analyze docker-compose.yml
        run: |
          echo "Checking for security issues in docker-compose.yml"

          # Sprawdzenie czy są hardcoded secrets
          if grep -r "password" docker-compose.yml | grep -v "POSTGRES_PASSWORD" | grep -v "_PASSWORD="; then
            echo "⚠️  WARNING: Potential hardcoded secrets found"
          fi

          # Sprawdzenie czy są używane latest tagi
          if grep -E "image:.*:latest" docker-compose.yml; then
            echo "⚠️  WARNING: Using 'latest' tag is not recommended"
          fi

          echo "✅ Docker Compose security check passed"
        continue-on-error: true

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs:
      [
        hadolint,
        dockerfile-lint,
        trivy-scan,
        sbom-generation,
        grype-scan,
        dependency-check,
        static-analysis-go,
        docker-compose-security,
      ]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## 🔒 Backend Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All security scans completed. Check individual job results for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Scans Performed:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Dockerfile Best Practices (Hadolint)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Dockerfile Security Lint (Dockle)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Container Image CVE Scan (Trivy)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ SBOM Generation (Syft)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ SBOM Vulnerability Scan (Grype)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Go Dependencies Check (govulncheck)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Go Static Analysis (golangci-lint, staticcheck, gosec, go vet)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Docker Compose Security Analysis" >> $GITHUB_STEP_SUMMARY
