name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Skanowanie codziennie o 2:00 (sprawdzanie nowych CVE)
    - cron: "0 2 * * *"

# Permissions dla SARIF upload do GitHub Security tab
permissions:
  contents: read
  security-events: write
  actions: read

# Security Policy:
# - CRITICAL/HIGH CVE → Pipeline FAILS (must fix)
# - MEDIUM/LOW CVE → Warning only (reported to Security tab)
# - Infrastructure issues (Hadolint/Dockle) → Info only (no block)

jobs:
  hadolint:
    name: Hadolint - Dockerfile Best Practices
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, quiz, stats, images, admin]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./${{ matrix.service }}/Dockerfile
          failure-threshold: style
          # Najbardziej strict: failuje na error > warning > info > style

  dockerfile-lint:
    name: Dockle - Dockerfile Security
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, quiz, stats, images, admin]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image for Dockle
        run: |
          docker build -t ${{ matrix.service }}:latest ./${{ matrix.service }}

      - name: Run Dockle
        uses: erzz/dockle-action@v1
        with:
          image: ${{ matrix.service }}:latest
          exit-code: 1
          failure-threshold: INFO
          # Najbardziej strict: failuje na FATAL > WARN > INFO

  trivy-scan:
    name: Trivy CVE Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [auth, quiz, stats, images, admin]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t ${{ matrix.service }}:latest ./${{ matrix.service }}

      - name: Run Trivy vulnerability scanner (SARIF for Security tab)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.service }}:latest
          format: "sarif"
          output: "trivy-results-${{ matrix.service }}.sarif"
          exit-code: 0
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          scanners: "vuln,secret"
          timeout: 15m

      - name: Run Trivy vulnerability scanner (Table for logs)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.service }}:latest
          format: "table"
          exit-code: 1
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          scanners: "vuln,secret"
          timeout: 15m

      - name: Run Trivy vulnerability scanner (JSON for report - all severities)
        uses: aquasecurity/trivy-action@master
        if: success() || failure()
        with:
          image-ref: ${{ matrix.service }}:latest
          format: "json"
          output: "trivy-report-${{ matrix.service }}.json"
          exit-code: 0
          ignore-unfixed: true
          severity: "CRITICAL,HIGH,MEDIUM,LOW"
          scanners: "vuln,secret"
          timeout: 15m

      - name: Upload Trivy results to GitHub Security tab
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: trivy-report-${{ matrix.service }}
          path: trivy-report-${{ matrix.service }}.json

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        with:
          sarif_file: "trivy-results-${{ matrix.service }}.sarif"

  sbom-generation:
    name: Generate SBOM (Syft)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, quiz, stats, images, admin]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t ${{ matrix.service }}:latest ./${{ matrix.service }}

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ matrix.service }}:latest
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json

  grype-scan:
    name: Vulnerability Scan SBOM (Grype)
    runs-on: ubuntu-latest
    needs: sbom-generation
    strategy:
      fail-fast: false
      matrix:
        service: [auth, quiz, stats, images, admin]
    steps:
      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom-${{ matrix.service }}

      - name: Scan SBOM with Grype (Table for logs)
        continue-on-error: true
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype sbom:sbom-${{ matrix.service }}.spdx.json -o table --fail-on medium

      - name: Scan SBOM with Grype (SARIF for Security tab)
        uses: anchore/scan-action@v3
        id: grype
        with:
          sbom: sbom-${{ matrix.service }}.spdx.json
          fail-build: true
          severity-cutoff: medium
          # Strict: failuje na CRITICAL > HIGH > MEDIUM
          output-format: sarif

      - name: Upload Grype SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        with:
          sarif_file: results.sarif

  dependency-check:
    name: Go Dependencies Security Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, quiz, stats, images, admin]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.23"
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: Run govulncheck
        run: |
          cd ${{ matrix.service }}
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  static-analysis-go:
    name: Go Static Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, quiz, stats, images, admin]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.23"
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: golangci-lint
        id: golangci-lint
        continue-on-error: true
        run: |
          cd ${{ matrix.service }}
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.64.8
          $(go env GOPATH)/bin/golangci-lint run --timeout=5m --out-format=json > ../golangci-lint-${{ matrix.service }}.json 2>&1 || true
          # Also generate readable output for logs
          $(go env GOPATH)/bin/golangci-lint run --timeout=5m 2>&1 || true

      - name: staticcheck
        id: staticcheck
        continue-on-error: true
        run: |
          cd ${{ matrix.service }}
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck -checks all -f json ./... > ../staticcheck-${{ matrix.service }}.json || echo "staticcheck found issues"

      - name: gosec (Security Scanner)
        id: gosec
        continue-on-error: true
        run: |
          cd ${{ matrix.service }}
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt=json -out=../gosec-${{ matrix.service }}.json ./... || echo "gosec found issues"

      - name: go vet
        id: govet
        continue-on-error: true
        run: |
          cd ${{ matrix.service }}
          go vet ./... 2>&1 | tee ../govet-${{ matrix.service }}.txt || echo "go vet found issues"

      - name: Generate Static Analysis Summary
        if: success() || failure()
        run: |
          mkdir -p reports
          echo "# Static Analysis Report: ${{ matrix.service }}" > reports/static-analysis-${{ matrix.service }}.md
          echo "" >> reports/static-analysis-${{ matrix.service }}.md

          # golangci-lint summary
          if [ -f "golangci-lint-${{ matrix.service }}.json" ]; then
            echo "## golangci-lint" >> reports/static-analysis-${{ matrix.service }}.md
            cat golangci-lint-${{ matrix.service }}.json >> reports/static-analysis-${{ matrix.service }}.md
            echo "" >> reports/static-analysis-${{ matrix.service }}.md
          fi

          # staticcheck summary
          if [ -f "staticcheck-${{ matrix.service }}.json" ]; then
            echo "## staticcheck" >> reports/static-analysis-${{ matrix.service }}.md
            cat staticcheck-${{ matrix.service }}.json >> reports/static-analysis-${{ matrix.service }}.md
            echo "" >> reports/static-analysis-${{ matrix.service }}.md
          fi

          # gosec summary
          if [ -f "gosec-${{ matrix.service }}.json" ]; then
            echo "## gosec (Security)" >> reports/static-analysis-${{ matrix.service }}.md
            cat gosec-${{ matrix.service }}.json >> reports/static-analysis-${{ matrix.service }}.md
            echo "" >> reports/static-analysis-${{ matrix.service }}.md
          fi

          # go vet summary
          if [ -f "govet-${{ matrix.service }}.txt" ]; then
            echo "## go vet" >> reports/static-analysis-${{ matrix.service }}.md
            cat govet-${{ matrix.service }}.txt >> reports/static-analysis-${{ matrix.service }}.md
          fi

      - name: Upload Static Analysis Report
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: static-analysis-report-${{ matrix.service }}
          path: |
            reports/static-analysis-${{ matrix.service }}.md
            golangci-lint-${{ matrix.service }}.json
            staticcheck-${{ matrix.service }}.json
            gosec-${{ matrix.service }}.json
            govet-${{ matrix.service }}.txt

      - name: Fail if any static analysis tool found issues
        if: steps.golangci-lint.outcome == 'failure' || steps.staticcheck.outcome == 'failure' || steps.gosec.outcome == 'failure' || steps.govet.outcome == 'failure'
        run: |
          echo "Static analysis found issues:"
          echo "- golangci-lint: ${{ steps.golangci-lint.outcome }}"
          echo "- staticcheck: ${{ steps.staticcheck.outcome }}"
          echo "- gosec: ${{ steps.gosec.outcome }}"
          echo "- go vet: ${{ steps.govet.outcome }}"
          exit 1

  docker-compose-security:
    name: Docker Compose Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Analyze docker-compose.yml
        run: |
          echo "Checking for security issues in docker-compose.yml"

          # Sprawdzenie czy są hardcoded secrets
          if grep -r "password" docker-compose.yml | grep -v "POSTGRES_PASSWORD" | grep -v "_PASSWORD="; then
            echo "⚠️  WARNING: Potential hardcoded secrets found"
          fi

          # Sprawdzenie czy są używane latest tagi
          if grep -E "image:.*:latest" docker-compose.yml; then
            echo "⚠️  WARNING: Using 'latest' tag is not recommended"
          fi

          echo "✅ Docker Compose security check passed"
        continue-on-error: true

  security-summary:
    name: Comprehensive Security Report
    runs-on: ubuntu-latest
    needs:
      [
        hadolint,
        dockerfile-lint,
        trivy-scan,
        sbom-generation,
        grype-scan,
        dependency-check,
        static-analysis-go,
        docker-compose-security,
      ]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate Security Report
        run: |
          echo "# PrediGroweeV2 Backend - Security Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Date:** $(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Trivy CVE Summary
          echo "## Container Vulnerability Scan (Trivy)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for service in auth quiz stats images admin; do
            if [ -f "artifacts/trivy-report-$service/trivy-report-$service.json" ]; then
              echo "### $service" >> $GITHUB_STEP_SUMMARY

              CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' "artifacts/trivy-report-$service/trivy-report-$service.json" 2>/dev/null || echo "0")
              HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' "artifacts/trivy-report-$service/trivy-report-$service.json" 2>/dev/null || echo "0")
              MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' "artifacts/trivy-report-$service/trivy-report-$service.json" 2>/dev/null || echo "0")
              LOW=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW")] | length' "artifacts/trivy-report-$service/trivy-report-$service.json" 2>/dev/null || echo "0")
              SECRETS=$(jq '[.Results[]?.Secrets[]?] | length' "artifacts/trivy-report-$service/trivy-report-$service.json" 2>/dev/null || echo "0")

              echo "**Vulnerabilities Found:**" >> $GITHUB_STEP_SUMMARY
              echo "- CRITICAL: $CRITICAL" >> $GITHUB_STEP_SUMMARY
              echo "- HIGH: $HIGH" >> $GITHUB_STEP_SUMMARY
              echo "- MEDIUM: $MEDIUM" >> $GITHUB_STEP_SUMMARY
              echo "- LOW: $LOW" >> $GITHUB_STEP_SUMMARY

              if [ "$SECRETS" -gt 0 ]; then
                echo "- Secrets Detected: $SECRETS" >> $GITHUB_STEP_SUMMARY
              fi

              # List critical CVEs with details
              if [ "$CRITICAL" -gt 0 ]; then
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "<details><summary>CRITICAL Vulnerabilities ($CRITICAL)</summary>" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL") | "CVE: \(.VulnerabilityID)\nPackage: \(.PkgName) \(.InstalledVersion)\nFixed: \(.FixedVersion // "N/A")\nTitle: \(.Title)\n---"' "artifacts/trivy-report-$service/trivy-report-$service.json" 2>/dev/null >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                echo "</details>" >> $GITHUB_STEP_SUMMARY
              fi

              # List high CVEs with details
              if [ "$HIGH" -gt 0 ]; then
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "<details><summary>HIGH Vulnerabilities ($HIGH)</summary>" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH") | "CVE: \(.VulnerabilityID)\nPackage: \(.PkgName) \(.InstalledVersion)\nFixed: \(.FixedVersion // "N/A")\nTitle: \(.Title)\n---"' "artifacts/trivy-report-$service/trivy-report-$service.json" 2>/dev/null | head -200 >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                echo "</details>" >> $GITHUB_STEP_SUMMARY
              fi

              # List medium CVEs with details
              if [ "$MEDIUM" -gt 0 ]; then
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "<details><summary>MEDIUM Vulnerabilities ($MEDIUM)</summary>" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM") | "CVE: \(.VulnerabilityID)\nPackage: \(.PkgName) \(.InstalledVersion)\nFixed: \(.FixedVersion // "N/A")\nTitle: \(.Title)\n---"' "artifacts/trivy-report-$service/trivy-report-$service.json" 2>/dev/null | head -200 >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                echo "</details>" >> $GITHUB_STEP_SUMMARY
              fi

              # List low CVEs (collapsed by default, just count)
              if [ "$LOW" -gt 0 ]; then
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "<details><summary>LOW Vulnerabilities ($LOW)</summary>" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW") | "CVE: \(.VulnerabilityID)\nPackage: \(.PkgName) \(.InstalledVersion)\nFixed: \(.FixedVersion // "N/A")\nTitle: \(.Title)\n---"' "artifacts/trivy-report-$service/trivy-report-$service.json" 2>/dev/null | head -100 >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                echo "</details>" >> $GITHUB_STEP_SUMMARY
              fi

              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Static Analysis Summary
          echo "## Go Static Analysis Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Debug: list all artifacts
          echo "Debug - Available artifacts:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -la artifacts/ >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          for service in auth quiz stats images admin; do
            echo "### $service" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Debug: list service artifact contents
            if [ -d "artifacts/static-analysis-report-$service" ]; then
              echo "Debug - Files in static-analysis-report-$service:" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              ls -la "artifacts/static-analysis-report-$service/" >> $GITHUB_STEP_SUMMARY || true
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            else
              echo "No static analysis artifact found for $service" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              continue
            fi

              # Parse golangci-lint JSON if exists
              if [ -f "artifacts/static-analysis-report-$service/golangci-lint-$service.json" ]; then
                GOLANGCI_ISSUES=$(jq '.Issues | length' "artifacts/static-analysis-report-$service/golangci-lint-$service.json" 2>/dev/null || echo "0")
                if [ "$GOLANGCI_ISSUES" -gt 0 ]; then
                  echo "**golangci-lint:** $GOLANGCI_ISSUES issues" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "<details><summary>View golangci-lint Issues</summary>" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY
                  jq -r '.Issues[] | "\(.Pos.Filename):\(.Pos.Line) - [\(.FromLinter)] \(.Text)"' "artifacts/static-analysis-report-$service/golangci-lint-$service.json" 2>/dev/null | head -100 >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY
                  echo "</details>" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                fi
              fi

              # Parse staticcheck JSON if exists
              if [ -f "artifacts/static-analysis-report-$service/staticcheck-$service.json" ]; then
                STATICCHECK_ISSUES=$(jq '. | length' "artifacts/static-analysis-report-$service/staticcheck-$service.json" 2>/dev/null || echo "0")
                if [ "$STATICCHECK_ISSUES" -gt 0 ]; then
                  echo "**staticcheck:** $STATICCHECK_ISSUES issues" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "<details><summary>View staticcheck Issues</summary>" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY
                  jq -r '.[] | "\(.location.file):\(.location.line) - \(.message)"' "artifacts/static-analysis-report-$service/staticcheck-$service.json" 2>/dev/null | head -100 >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY
                  echo "</details>" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                fi
              fi

              # Parse gosec JSON if exists
              if [ -f "artifacts/static-analysis-report-$service/gosec-$service.json" ]; then
                GOSEC_ISSUES=$(jq '.Issues | length' "artifacts/static-analysis-report-$service/gosec-$service.json" 2>/dev/null || echo "0")
                if [ "$GOSEC_ISSUES" -gt 0 ]; then
                  echo "**gosec (Security):** $GOSEC_ISSUES issues" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "<details><summary>View gosec Security Issues</summary>" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY
                  jq -r '.Issues[] | "\(.file):\(.line) - [\(.severity)] \(.details)"' "artifacts/static-analysis-report-$service/gosec-$service.json" 2>/dev/null | head -100 >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY
                  echo "</details>" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                fi
              fi

              # Parse go vet output if exists
              if [ -f "artifacts/static-analysis-report-$service/govet-$service.txt" ]; then
                GOVET_LINES=$(wc -l < "artifacts/static-analysis-report-$service/govet-$service.txt" 2>/dev/null || echo "0")
                if [ "$GOVET_LINES" -gt 0 ]; then
                  echo "**go vet:** Issues found" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "<details><summary>View go vet Issues</summary>" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY
                  cat "artifacts/static-analysis-report-$service/govet-$service.txt" | head -100 >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY
                  echo "</details>" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                fi
              fi

              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Summary Statistics
          echo "## Summary Statistics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dockerfile Best Practices (Hadolint) | Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| Dockerfile Security (Dockle) | Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| Container CVE Scan (Trivy) | Completed (5 services) |" >> $GITHUB_STEP_SUMMARY
          echo "| SBOM Generation (Syft) | Completed (5 services) |" >> $GITHUB_STEP_SUMMARY
          echo "| SBOM Vulnerability Scan (Grype) | Completed (5 services) |" >> $GITHUB_STEP_SUMMARY
          echo "| Go Dependencies (govulncheck) | Completed (5 services) |" >> $GITHUB_STEP_SUMMARY
          echo "| Go Static Analysis | Completed (5 services) |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Compose Security | Completed |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Detailed reports available in workflow artifacts**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tip: Download artifacts to view full JSON/Markdown reports" >> $GITHUB_STEP_SUMMARY
