server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker containers
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["logging=promtail"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "stream"
      - source_labels:
          ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"
    pipeline_stages:
      # Parse JSON logs
      - json:
          expressions:
            level: level
            msg: msg
            timestamp: timestamp
      # Extract security-related events
      - labels:
          level:
          service:
      # Add security labels for specific patterns
      - match:
          selector: '{service=~"auth|admin"}'
          stages:
            - regex:
                expression: "(?P<security_event>authentication|authorization|login|logout|access_denied|permission|role)"
            - labels:
                security_event:
      # Extract HTTP status codes
      - regex:
          expression: '.* (?P<status_code>\d{3}) .*'
      - labels:
          status_code:
      # Drop debug logs in production (optional)
      # - drop:
      #     expression: '.*level=debug.*'

  # System logs (optional)
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log

  # Security-specific log collection
  - job_name: security
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: ".*(auth|admin|nginx).*"
        action: keep
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels:
          ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
      # Security event detection
      - match:
          selector: '{service="auth"}'
          stages:
            - regex:
                expression: "(?i)(?P<security_type>failed.*login|unauthorized|forbidden|invalid.*token|suspicious)"
            - labels:
                security_type:
                alert: "true"
      - match:
          selector: '{service="nginx"}'
          stages:
            - regex:
                expression: '.* (?P<http_method>\w+) .* (?P<http_status>\d{3}) .*'
            - labels:
                http_method:
                http_status:
      # Alert on suspicious HTTP codes
      - match:
          selector: '{http_status=~"4[0-9]{2}|5[0-9]{2}"}'
          stages:
            - labels:
                alert_level: "warning"
