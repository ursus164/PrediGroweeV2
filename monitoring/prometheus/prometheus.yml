global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'predigrowee'
    environment: 'development'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Load rules once and periodically evaluate them
rule_files:
  # - "alerts/*.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Node Exporter - host metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'

  # cAdvisor - container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'

  # Go microservices - assuming they expose /metrics endpoint
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth:8080']
        labels:
          service: 'auth'
    metrics_path: '/metrics'

  - job_name: 'quiz-service'
    static_configs:
      - targets: ['quiz:8080']
        labels:
          service: 'quiz'
    metrics_path: '/metrics'

  - job_name: 'stats-service'
    static_configs:
      - targets: ['stats:8080']
        labels:
          service: 'stats'
    metrics_path: '/metrics'

  - job_name: 'images-service'
    static_configs:
      - targets: ['images:8080']
        labels:
          service: 'images'
    metrics_path: '/metrics'

  - job_name: 'admin-service'
    static_configs:
      - targets: ['admin:8080']
        labels:
          service: 'admin'
    metrics_path: '/metrics'

  # PostgreSQL Exporter (optional - requires postgres_exporter)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # Nginx (requires nginx-prometheus-exporter or stub_status)
  # - job_name: 'nginx'
  #   static_configs:
  #     - targets: ['nginx:9113']
