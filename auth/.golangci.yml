# golangci-lint configuration for PrediGroweeV2
# https://golangci-lint.run/usage/configuration/

version: 2

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    # Default linters (already enabled, but explicit is better)
    - errcheck      # Check for unchecked errors
    - govet         # Official Go tool (replaces: go vet)
    - ineffassign   # Detect ineffectual assignments  
    - staticcheck   # Advanced static analysis (replaces: staticcheck)
    - unused        # Check for unused code
    
    # Security
    - gosec         # Security scanner (replaces: gosec)
    
    # Error handling
    - errorlint     # Error wrapping issues
    
    # Code quality & bugs
    - bodyclose     # Check HTTP response body is closed
    - noctx         # HTTP request without context.Context
    - rowserrcheck  # Check sql.Rows.Err()
    - sqlclosecheck # Check sql.Rows/Stmt are closed
    
    # Performance
    - prealloc      # Pre-allocate slices
    
    # Complexity
    - gocyclo       # Cyclomatic complexity
    - gocognit      # Cognitive complexity
    
    # Style & simplicity
    - misspell      # Fix commonly misspelled words
    
  disable:
    # Too strict for this project
    - exhaustive
    - exhaustruct
    - varnamelen
    - wrapcheck
    - nlreturn
    - wsl
    - godox         # Don't fail on TODO/FIXME
    - revive        # Disabled - too many style issues

linters-settings:
  govet:
    check-shadowing: true
    enable-all: true
  
  staticcheck:
    checks: ["all"]
  
  gosec:
    severity: medium
    confidence: medium
    excludes:
      - G104  # Audit errors not checked (covered by errcheck)
  
  errcheck:
    check-type-assertions: true
    check-blank: true
  
  gocyclo:
    min-complexity: 15
  
  gocognit:
    min-complexity: 20
  
  misspell:
    locale: US

issues:
  exclude-rules:
    # Exclude some linters from test files
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - gosec
    
    # Exclude known linters from generated files
    - path: ".*\\.pb\\.go"
      linters:
        - all
  
  max-issues-per-linter: 0
  max-same-issues: 0
  
  # Don't skip warning about doc comments
  exclude-use-default: false

output:
  print-issued-lines: true
  print-linter-name: true
  sort-results: true
