services:
  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:3001:3000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth
      - images
      - quiz
      - stats
      - admin
      - frontend
    networks:
      - frontend_network
      - backend_network
      - monitoring
    labels:
      logging: "promtail"
    # Security hardening
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
      - apparmor=docker-default
    read_only: true
    tmpfs:
      - /var/run:size=10M,mode=0755
      - /var/cache/nginx:size=100M,mode=0755
      - /var/log/nginx:size=50M,mode=0755
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
          pids: 50
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Postgres for Auth
  auth_db:
    image: postgres:13
    environment:
      - POSTGRES_USER=auth_user
      - POSTGRES_PASSWORD=auth_password
      - POSTGRES_DB=auth_db
      - auth_db_data:/var/lib/postgresql/data
      - ./database-init/auth:/docker-entrypoint-initdb.d
      - "127.0.0.1:5433:5432"  # Different port for local development
      - db_network
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      - DAC_OVERRIDE
      - /tmp:size=100M,mode=1777
      - /var/run/postgresql:size=10M,mode=0755
          cpus: '1.0'
          memory: 512M
          pids: 100
  # Postgres for Quiz
  quiz_db:
      - POSTGRES_USER=quiz_user
      - POSTGRES_PASSWORD=quiz_password
      - POSTGRES_DB=quiz_db
      - quiz_db_data:/var/lib/postgresql/data
      - ./database-init/quiz:/docker-entrypoint-initdb.d
      - "127.0.0.1:5435:5432"  # Different port for local development
      test: ["CMD-SHELL", "pg_isready -U quiz_user -d quiz_db"]
  # Postgres for Stats
  stats_db:
      - POSTGRES_USER=stats_user
      - POSTGRES_PASSWORD=stats_password
      - POSTGRES_DB=stats_db
      - stats_db_data:/var/lib/postgresql/data
      - ./database-init/stats:/docker-entrypoint-initdb.d
      - "127.0.0.1:5436:5432"  # Different port for local development
      test: ["CMD-SHELL", "pg_isready -U stats_user -d stats_db"]
  images_db:
      - POSTGRES_USER=images_user
      - POSTGRES_PASSWORD=images_password
      - POSTGRES_DB=images_db
      - images_db_data:/var/lib/postgresql/data
      - ./database-init/images:/docker-entrypoint-initdb.d
      - "127.0.0.1:5438:5432"  # Different port for local development
      test: ["CMD-SHELL", "pg_isready -U images_user -d images_db"]
  # Auth microservice
  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    expose:
      - "8080"
      - DB_HOST=auth_db
      - DB_PORT=5432
      - DB_USER=auth_user
      - DB_PASSWORD=auth_password
      - DB_NAME=auth_db
      - ENV=local
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_API_KEY=api_key
      - auth_db
  # Images microservice
  images:
      context: ./images
      - DB_HOST=images_db
      - DB_USER=images_user
      - DB_PASSWORD=images_password
      - DB_NAME=images_db
      - ./images_data:/app/images
      - images_db
  # Quiz microservice
  quiz:
      context: ./quiz
      - DB_HOST=quiz_db
      - DB_USER=quiz_user
      - DB_PASSWORD=quiz_password
      - DB_NAME=quiz_db
      - quiz_db
  stats:
        context: ./stats
        dockerfile: Dockerfile
      - DB_HOST=stats_db
      - DB_USER=stats_user
      - DB_PASSWORD=stats_password
      - DB_NAME=stats_db
        - stats_db
        - auth
  admin:
      context: ./admin
  frontend:
      context: ../PrediGroweeV2-UI
      dockerfile: Dockerfile.dev
      args:
        - ENV=local
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=711820824033-s1vvhg02269re31p02bs3snvk3lsnl3a.apps.googleusercontent.com
        - NEXT_PUBLIC_AUTH_SERVICE_URL=http://localhost:8080/api/auth
        - NEXT_PUBLIC_QUIZ_SERVICE_URL=http://localhost:8080/api/quiz
        - NEXT_PUBLIC_STATS_SERVICE_URL=http://localhost:8080/api/stats
        - NEXT_PUBLIC_IMAGES_SERVICE_URL=http://localhost:8080/api/images
        - AUTH_SERVICE_INTERNAL_URL=http://auth:8080/auth
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=711820824033-s1vvhg02269re31p02bs3snvk3lsnl3a.apps.googleusercontent.com
      - NEXT_PUBLIC_AUTH_SERVICE_URL=http://localhost:8080/api/auth
      - NEXT_PUBLIC_QUIZ_SERVICE_URL=http://localhost:8080/api/quiz
      - NEXT_PUBLIC_STATS_SERVICE_URL=http://localhost:8080/api/stats
      - NEXT_PUBLIC_IMAGES_SERVICE_URL=http://localhost:8080/api/images
      - AUTH_SERVICE_INTERNAL_URL=http://auth:8080/auth
      - ./content:/app/content
      - "3000"
      - /tmp:size=200M,mode=1777
      - /app/.next:size=500M,mode=0755,uid=1001,gid=1001
          memory: 1024M
          pids: 200
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      start_period: 60s
volumes:
  auth_db_data:
  quiz_db_data:
  stats_db_data:
  images_db_data:
  images_data:
  content:
networks:
  frontend_network:
    driver: bridge
  backend_network:
  db_network:
  monitoring:
    external: true
    name: predigroweev2_monitoring
